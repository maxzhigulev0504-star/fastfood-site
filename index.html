<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>FastFood</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }
    header {
      padding: 40px;
      background: #e63946;
      font-size: 32px;
      font-weight: bold;
    }
    .menu {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      padding: 20px;
    }
    .card {
      background: #222;
      margin: 15px;
      padding: 15px;
      border-radius: 10px;
      width: 200px;
    }
    img {
      width: 100%;
      border-radius: 10px;
    }
    .price {
      color: #ffd166;
      font-size: 20px;
    }
  </style>
</head>
<body>

<header>🍔 FastFood</header>

<h2>Наше меню</h2>

<div class="menu">
  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Бургер</h3>
    <p class="price">5€</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Картошка</h3>
    <p class="price">3€</p>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/200">
    <h3>Кола</h3>
    <p class="price">2€</p>
  </div>
</div>

</body>
</html>
